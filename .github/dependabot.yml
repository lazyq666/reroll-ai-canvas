version: 2
# Zero disables routine version PRs; security updates use a separate limit.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # The .in/.txt pair routes updates through pip-compile. Keep transitive
    # updates enabled after generated pins stop being classified as direct.
    allow:
      - dependency-type: all
    groups:
      pydantic-runtime:
        patterns:
          - pydantic
          - pydantic-core
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
