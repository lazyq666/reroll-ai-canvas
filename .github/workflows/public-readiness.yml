name: Public readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install locked Node.js test dependencies
        run: npm ci

      - name: Install browser used by the core UI contract
        run: npx --no-install playwright install --with-deps chromium

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv==0.10.0
          uvx --from pip-audit==2.9.0 pip-audit --disable-pip -r requirements.lock.txt
          uv pip sync requirements.lock.txt --system

      - name: Compile Python sources
        run: python -m compileall -q backend scripts tests

      - name: Audit tracked public tree
        run: python scripts/audit_public_tree.py

      - name: Audit public Git history
        run: python scripts/audit_public_history.py HEAD

      - name: Verify vendored Web Awesome release
        run: python scripts/verify_webawesome_vendor.py

      - name: Verify documentation knowledge map
        run: python -m unittest tests.test_documentation_knowledge_map

      - name: Run JavaScript state and contract tests
        run: npm test

      - name: Run core browser contract
        env:
          IC_RUN_BROWSER_TESTS: "1"
        run: |
          IC_BROWSER_BIN="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          export IC_BROWSER_BIN
          python -m unittest tests.test_infinite_canvas_ui_core

      - name: Run deterministic Python test suite
        env:
          # Shared hosted runners are not a controlled performance environment.
          IC_SKIP_PERFORMANCE_TESTS: "1"
        run: python -m unittest discover
