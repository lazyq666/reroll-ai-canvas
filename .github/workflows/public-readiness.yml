name: Public readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Previous main commit to compare the release version against
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-readiness-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  public-audit:
    name: public-audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested merge or push commit with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Run shared public-audit inventory
        run: python scripts/public_readiness.py group public-audit --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/public-audit.json"
      - name: Preserve metadata even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-public-audit-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Show result summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/public-audit.json"; then
            echo '### public-audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$RUNNER_TEMP/public-audit.json" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

  python-tests:
