  readiness-gate:
    name: Public readiness gate
    needs: [public-audit, python-tests, node-tests, browser-core, repository-contracts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the tested merge or push commit with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download this attempt's evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: readiness-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/readiness-reports
      - name: Require every group and matching candidate evidence
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/public_readiness.py gate --reports "$RUNNER_TEMP/readiness-reports" --needs "$NEEDS_JSON" --base "$BASE_SHA" --head "$HEAD_SHA"
