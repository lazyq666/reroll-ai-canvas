<!doctype html>
<html lang="zh-CN" data-ui-scope="share" data-studio-scale="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/static/js/page-zoom-guard.js?v=2026.09.04.3.1788439320"></script>
  <script src="/static/js/theme.js?v=2026.09.04.3.1788439320"></script>
    <script src="/static/js/i18n.js?v=i18n-loader-01910c282d9b"></script>
  <meta name="robots" content="noindex,nofollow">
  <title data-i18n="share.pageTitle">画布分享 · Reroll</title>
  <link rel="icon" href="/static/images/brand/favicon.png?v=2026.08.29.reroll.1" type="image/png">
  <link rel="stylesheet" href="/static/css/design-tokens.css?v=2026.09.04.3.1788439320">
  <link rel="stylesheet" href="/static/css/smart-canvas.css?v=asset-d2c5261ae32a">
  <link rel="stylesheet" href="/static/css/canvas-share.css?v=2026.09.04.3.1788439320">
</head>
<body>
  <header class="share-bar">
    <div class="share-brand"><img class="share-logo" src="/static/images/brand/logo.png" alt="Reroll"><strong id="canvas-title" data-i18n="share.canvasShare">画布分享</strong></div>
    <div class="share-actions"><ic-badge kind="label" size="small" tone="neutral" data-i18n="share.readOnly">只读</ic-badge></div>
  </header>
  <main id="share-viewport" aria-label="只读画布" data-i18n-aria-label="share.readOnlyCanvas">
    <div id="share-stage"><svg id="share-links" width="1" height="1" aria-hidden="true"></svg><div id="share-nodes"></div></div>
    <ic-loading id="share-loading" presentation="region" label="正在载入画布…" data-i18n-label="share.loading"></ic-loading>
    <ic-alert id="share-error" tone="danger" hidden><span class="share-error-copy"><span class="share-error-title" data-i18n="share.openFailed">无法打开此画布</span><span id="share-error-detail"></span></span></ic-alert>
    <ic-card id="share-minimap" class="minimap" size="small" label="导航地图" title="导航地图" data-i18n-label="share.minimap" data-i18n-title="share.minimap">
      <div id="share-minimap-content" class="minimap-content">
        <div id="share-minimap-viewport" class="minimap-viewport"></div>
      </div>
    </ic-card>
    <div id="share-composer" class="composer">
      <div class="composer-card">
        <div class="prompt-row prompt-editor-shell">
          <ic-prompt-composer id="promptInput" contenteditable="false" aria-label="提示词编辑器" aria-describedby="promptCharacterCount"></ic-prompt-composer>
          <span id="promptCharacterCount" class="prompt-character-count" data-prompt-character-count>0 字符</span>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="/static/js/infinite-canvas-ui/core.js?v=ic-ui-ef410096e2b4"></script>
  <script src="/static/js/smart-image-resolution.js?v=2026.09.04.3.1788439320" defer></script>
  <script src="/static/js/smart-canvas/node-geometry.js?v=2026.09.04.3.1788439320" defer></script>
  <script src="/static/js/smart-canvas/canvas-level-of-detail.js?v=2026.09.04.3.1788439320" defer></script>
  <script src="/static/js/smart-canvas/canvas-far-presentation.js?v=2026.09.04.3.1788439320" defer></script>
  <script src="/static/js/smart-canvas/canvas-virtualization.js?v=2026.09.04.3.1788439320" defer></script>
  <script src="/static/js/canvas-share.js?v=2026.09.04.3.1788439320" defer></script>
</body>
</html>
