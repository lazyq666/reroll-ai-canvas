<!doctype html>
<html lang="zh-CN" data-ui-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reroll UI · 节点浮动操作栏</title>
  <link rel="stylesheet" href="/static/css/design-tokens.css">
    <script src="/static/js/i18n.js?v=i18n-loader-ea009f20e988"></script>
  <style>
    html,body{margin:0;min-height:100%;background:var(--ui-color-surface-canvas);color:var(--ui-color-text-primary);font-family:var(--ui-font-sans)}
    body{padding:var(--ui-space-6)}
    main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--ui-space-4)}
    article{min-width:0;min-height:12rem;display:grid;place-items:center;padding:var(--ui-space-4);border:var(--ui-border-width-thin) solid var(--ui-color-border-secondary);border-radius:var(--ui-radius-l);background:var(--ui-color-surface)}
    @media(max-width:760px){main{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main aria-label="节点浮动操作栏 Block">
    <article data-smart-node-toolbar-variant="node"><ic-smart-node-toolbar data-preview-state="visible" data-component-name="ic-smart-node-toolbar" label="节点操作">
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="reverse-prompt" size="x-small"></ic-icon>反推提示词</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="online-generate" size="x-small"></ic-icon>生成图片</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="cut" size="x-small"></ic-icon>抠图</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="edit" size="x-small"></ic-icon>编辑</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="download" size="x-small"></ic-icon>下载</ic-button>
    </ic-smart-node-toolbar></article>
    <article data-smart-node-toolbar-variant="multi-selection"><ic-smart-node-toolbar data-preview-state="visible" label="多选节点操作">
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="layout-grid" size="x-small"></ic-icon>宫格</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="layout-horizontal" size="x-small"></ic-icon>水平</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="layout-vertical" size="x-small"></ic-icon>垂直</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="layout-tree" size="x-small"></ic-icon>树状</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="download" size="x-small"></ic-icon>下载</ic-button>
    </ic-smart-node-toolbar></article>
    <article data-smart-node-toolbar-variant="smart-group"><ic-smart-node-toolbar data-preview-state="visible" label="编组操作">
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="arrange" size="x-small"></ic-icon>整理选中</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="preview" size="x-small"></ic-icon>预览</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="join-grid" size="x-small"></ic-icon>宫格拼接</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="archive" size="x-small"></ic-icon>批量下载</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="ungroup" size="x-small"></ic-icon>解散编组</ic-button>
    </ic-smart-node-toolbar></article>
    <article data-smart-node-toolbar-variant="frame"><ic-smart-node-toolbar data-preview-state="visible" label="分区操作">
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="edit" size="x-small"></ic-icon>重命名分区</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="color" size="x-small"></ic-icon>切换颜色</ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="download" size="x-small"></ic-icon><span data-i18n="smart.contextDownload">下载</span></ic-button>
      <ic-button type="button" size="xs" hierarchy="quiet"><ic-icon slot="start" name="ungroup-frame" size="x-small"></ic-icon>取消分区</ic-button>
    </ic-smart-node-toolbar></article>
  </main>
  <script type="module" src="/static/js/infinite-canvas-ui/core.js?v=ic-ui-ef410096e2b4"></script>
  <script type="module" src="/static/js/infinite-canvas-ui/component-name-tag.js?v=ic-ui-ef410096e2b4"></script>
</body>
</html>
