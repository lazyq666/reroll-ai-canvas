<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off" data-ui-scope="canvas-list">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>try { if(window.parent !== window) window.parent.syncStudioCanvasFrameLayout?.(window); } catch (_) {}</script>
    <script src="/static/js/page-zoom-guard.js?v=asset-16dab7025174"></script>
    <link rel="icon" href="/static/images/brand/favicon.png?v=asset-bd89f9a7f64c" type="image/png">
    <title data-i18n="workspace.pageTitle">项目工作台</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="/static/css/design-tokens.css?v=asset-b180cf511553">
    <script src="/static/js/theme.js?v=asset-1ddf24aab306"></script>
    <script src="/static/js/touch-mouse.js?v=asset-44e687594d16"></script>
    <script src="/static/js/i18n.js?v=asset-2466177ef1d6"></script>
    <link rel="stylesheet" href="/static/css/canvas-list.css?v=asset-f17902eb4bcd">
    <link rel="stylesheet" href="/static/css/account-avatar.css?v=asset-e1cd44d31e57">
    <link rel="stylesheet" href="/static/css/theme.css?v=asset-f59222b3057c">
</head>
<body>
    <div id="workspace" class="workspace">
        <!-- LEFT: project sidebar -->
        <aside id="sidebar" class="ws-sidebar">
            <div class="ws-side-head">
                <div class="ws-side-title" data-i18n="workspace.projects">项目</div>
                <ic-icon-button id="newProjectBtn" class="ws-side-add" type="button" size="s" hierarchy="secondary" icon="add" label="新建项目" data-i18n-label="workspace.newProject"></ic-icon-button>
            </div>
            <ic-input id="projectSearch" class="ws-project-search" type="search" placeholder="搜索项目" aria-label="搜索项目" data-i18n-placeholder="workspace.searchProjects" data-i18n-aria-label="workspace.searchProjects" clearable></ic-input>
            <div id="newProjectRow" class="ws-newproj-row">
                <ic-input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="项目名称" aria-label="项目名称" data-i18n-placeholder="workspace.projectName" data-i18n-aria-label="workspace.projectName"></ic-input>
                <ic-icon-button id="newProjectCancel" class="ws-mini-btn" type="button" size="s" hierarchy="quiet" icon="close" label="取消" data-i18n-label="common.cancel"></ic-icon-button>
                <ic-icon-button id="newProjectConfirm" class="ws-mini-btn" type="button" size="s" hierarchy="secondary" icon="check" label="确定" data-i18n-label="common.confirm"></ic-icon-button>
            </div>
            <ic-tabs id="projectList" class="ws-project-list" label="项目筛选" aria-label="项目筛选" data-i18n-label="workspace.projects" data-legal-combination="vertical-manual-label" orientation="vertical" activation="manual"></ic-tabs>
            <p id="projectSearchEmpty" class="ws-project-search-empty" data-i18n="workspace.noMatchingProjects" hidden>没有匹配的项目</p>
        </aside>

        <!-- RIGHT: board -->
        <main class="ws-main">
            <ic-canvas-grid class="ws-list-grid" aria-hidden="true"></ic-canvas-grid>
            <header class="ws-list-header">
                <div class="ws-list-heading">
                    <h1 id="listProjectName" data-i18n="workspace.projects">项目</h1>
                    <ic-toolbar class="ws-topbar-right" label="画布浏览操作" data-i18n-label="workspace.browseActions" appearance="plain" data-ui-density="small">
                    <ic-button id="pasteCanvasBtn" class="ws-paste-btn" type="button" hierarchy="secondary" title="迁移到此项目" data-i18n-title="workspace.pasteHere" hidden><ic-icon slot="start" name="project" aria-hidden="true"></ic-icon><span data-i18n="workspace.pasteHere">迁移到此项目</span></ic-button>
                    <ic-button id="trashEntry" class="ws-trash-entry" type="button" size="m" hierarchy="quiet"><ic-icon slot="start" class="ws-project-icon" name="delete" size="small" aria-hidden="true"></ic-icon><span data-i18n="workspace.trash">回收站</span><ic-badge id="trashBadge" slot="end" class="ws-trash-badge" kind="count" tone="neutral">0</ic-badge></ic-button>
                    <ic-icon-button id="boardRefresh" class="ws-icon-btn" type="button" hierarchy="secondary" icon="refresh" label="刷新" data-i18n-label="workspace.refresh"></ic-icon-button>
                    <ic-button id="newCanvasBtn" class="ws-primary-btn" type="button" hierarchy="primary"><ic-icon slot="start" name="add" aria-hidden="true"></ic-icon><span data-i18n="workspace.newCanvas">新建画布</span></ic-button>
                    </ic-toolbar>
                </div>
                <div class="ws-list-filters">
                    <ic-segmented-control id="visibilityFilter" label="画布分类" data-i18n-label="workspace.canvasCategories" size="medium" data-legal-combination="single-label" value="all">
                        <button type="button" data-value="all" data-i18n="workspace.allCanvases">全部画布</button>
                        <button type="button" data-value="shared" data-i18n="workspace.sharedCanvases">共享</button>
                        <button type="button" data-value="mine" data-i18n="workspace.myCanvases">我的</button>
                    </ic-segmented-control>
                    <div class="ws-list-tools">
                        <ic-input id="canvasSearch" type="search" placeholder="搜索画布" aria-label="搜索画布" data-i18n-placeholder="workspace.searchCanvases" data-i18n-aria-label="workspace.searchCanvases" clearable></ic-input>
                        <ic-select id="canvasSort" name="canvas-sort" value="updated" aria-label="排序方式" data-i18n-aria-label="workspace.sortBy">
                            <option value="updated" data-i18n="workspace.sortUpdated">最近修改</option>
                            <option value="created" data-i18n="workspace.sortCreated">创建时间</option>
                            <option value="title" data-i18n="workspace.sortTitle">名称</option>
                        </ic-select>
                        <ic-select id="canvasDirection" name="canvas-direction" value="desc" aria-label="排序顺序" data-i18n-aria-label="workspace.sortDirection">
                            <option value="desc" data-i18n="workspace.sortDescending">降序</option>
                            <option value="asc" data-i18n="workspace.sortAscending">升序</option>
                        </ic-select>
                    </div>
                </div>
            </header>
            <div id="board" class="ws-board" aria-busy="true" tabindex="0" aria-label="画布列表" data-i18n-aria-label="workspace.canvasList">
                <div id="boardWorld" class="ws-board-world"></div>
                <div class="ws-list-footer"><ic-button id="boardLoadMore" class="ws-load-more-btn" type="button" hierarchy="secondary" title="加载更多" data-i18n-title="workspace.loadMoreCanvases" hidden><span data-i18n="workspace.loadMore">加载更多</span></ic-button></div>
                <ic-loading id="boardLoading" class="ws-board-loading" label="正在加载画布" data-i18n-label="workspace.loadingCanvases" presentation="region" loading-animation="brand"></ic-loading>
                <ic-empty-state id="boardEmptyHint" class="ws-board-empty hidden" title="暂无画布" label="画布列表为空">
                    <ic-icon slot="illustration" name="pointer" size="large" aria-hidden="true"></ic-icon>
                    <span data-i18n="workspace.createFirst">新建画布，开始创作。</span>
                    <ic-button slot="action" id="emptyCreateCanvasBtn" class="ws-primary-btn" type="button" hierarchy="primary"><ic-icon slot="start" name="add" aria-hidden="true"></ic-icon><span data-i18n="workspace.newCanvas">新建画布</span></ic-button>
                </ic-empty-state>
            </div>

            <!-- Trash panel (overlay over the board area) -->
            <div id="trashPanel" class="ws-trash-panel">
                <div class="ws-trash-head">
                    <div class="ws-trash-head-title"><ic-icon name="delete" aria-hidden="true"></ic-icon><span data-i18n="workspace.trash">回收站</span></div>
                    <ic-icon-button id="trashClose" class="ws-icon-btn" type="button" hierarchy="quiet" icon="close" label="关闭" data-i18n-label="common.close"></ic-icon-button>
                </div>
                <ic-alert class="ws-trash-note" tone="neutral"><span data-i18n="workspace.trashRetention">画布移入回收站 30 天后永久删除。</span></ic-alert>
                <div id="trashList" class="ws-trash-list"></div>
            </div>
        </main>
    </div>

    <ic-dialog id="createCanvasDialog" label="新建画布" size="small" dismiss-policy="explicit">
        <div class="ws-create-form">
            <ic-form-field id="createCanvasNameField" label="画布名称" hint="可留空，将按当前时间自动命名">
                <ic-input id="createCanvasName" slot="control" type="text" maxlength="80" placeholder="画布名称（可留空）" autofocus></ic-input>
            </ic-form-field>
        </div>
        <ic-button id="createCanvasCancel" slot="footer" type="button" hierarchy="secondary">取消</ic-button>
        <ic-button id="createCanvasConfirm" slot="footer" type="button" hierarchy="primary">创建</ic-button>
    </ic-dialog>

    <ic-confirmation-dialog id="canvasActionConfirmation" label="确认画布操作" description="确认执行此操作。" cancel-label="取消" confirm-label="确定" consequence="neutral">
        <p id="canvasActionConfirmationCopy">确认执行此操作。</p>
    </ic-confirmation-dialog>

    <ic-popover id="canvasSharePopover" class="ws-share-popover" label="分享链接" data-i18n-label="workspace.shareLink" content="interactive" dismiss-policy="light" focus-policy="move-into" placement="block-end" alignment="end">
        <div class="ws-share-popover-title" data-i18n="workspace.shareLink">分享链接</div>
        <div class="ws-share-popover-row">
            <div class="ws-share-link-slot"></div>
            <ic-icon-button class="ws-share-action revoke" type="button" size="s" hierarchy="secondary" icon="unlink" label="停止分享" data-i18n-label="workspace.stopSharing" data-share-revoke></ic-icon-button>
            <ic-icon-button class="ws-share-action" type="button" size="s" hierarchy="secondary" icon="refresh" label="更换链接" data-i18n-label="workspace.replaceShareLink" data-share-regenerate></ic-icon-button>
        </div>
    </ic-popover>

    <script type="module" src="/static/js/infinite-canvas-ui/core.js?v=asset-c09e9cef616f"></script>
    <script src="/static/js/account-avatar.js?v=asset-e24180e8c9db"></script>
    <script src="/static/js/canvas-list-presence.js?v=asset-1b9a85388f49"></script>
    <script src="/static/js/canvas-list.js?v=asset-fbe819777a47"></script>
<script src="/static/js/agent-pairing.js?v=asset-282f940e0cec" defer></script>
</body>
</html>
