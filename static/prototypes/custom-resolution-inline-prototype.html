<!doctype html>
<html lang="zh-CN" data-ui-scope="smart-canvas"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="laz84.inlineTitle"></title><link rel="icon" href="data:,">
<!-- PROTOTYPE: LAZ-84. Uses the production Composer markup, CSS and ic-* components.
     Only the sizing-picker instance is decorated; production components are unchanged.
     Run: python3 -m http.server 8840 --bind 127.0.0.1 -->
<link rel="stylesheet" href="/static/css/design-tokens.css"><link rel="stylesheet" href="/static/css/smart-canvas.css">
<script src="/static/js/i18n-core.js"></script><script src="/static/js/i18n/model-management.js"></script><script src="/static/js/i18n/smart-canvas.js"></script>
<style>
html,body{height:auto;min-height:100%;overflow:auto}body{background:var(--ui-color-surface-canvas);color:var(--ui-color-text-primary);font-family:var(--ui-font-sans)}main{max-width:1200px;margin:32px auto;padding:0 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:start}h1{font:var(--ui-text-title-1);margin:0 0 8px}p{font:var(--ui-text-body);color:var(--ui-color-text-tertiary);margin:8px 0 18px}.controls{display:flex;gap:8px;flex-wrap:wrap}button{font:var(--ui-text-body-compact);padding:8px 12px;border:1px solid var(--ui-color-border-secondary);border-radius:var(--ui-radius-s);background:var(--ui-color-surface);color:var(--ui-color-text-primary);cursor:pointer}button:focus-visible{outline:var(--ui-focus-ring);outline-offset:var(--ui-focus-ring-offset)}button:disabled{opacity:.5}.stage{position:relative;min-height:600px;margin-top:24px;display:flex;align-items:flex-end;justify-content:center;padding:40px 24px 65px;border:1px solid var(--ui-color-border-secondary);border-radius:var(--ui-radius-l);background-color:var(--ui-color-surface-subtle);background-image:radial-gradient(var(--ui-color-border-canvas-grid) .6px,transparent .6px);background-size:16px 16px}.stage-label{position:absolute;left:24px;top:18px;color:var(--ui-color-text-tertiary);font:var(--ui-text-caption)}.stage .composer{position:relative;inset:auto;width:min(48rem,100%)}.stage .composer:not(.focused){translate:none}.notes{display:flex;justify-content:space-between;gap:24px;margin:18px 0}.notes p{max-width:700px}.walk{border-top:1px solid var(--ui-color-border-secondary);padding:20px 0}.walk h2{font:var(--ui-text-title-3);margin:0 0 12px}.walk button[aria-pressed=true]{border-color:var(--ui-color-border-primary);background:var(--ui-color-action-secondary)}#status{font:var(--ui-text-caption);color:var(--ui-color-text-tertiary)}dialog{color:var(--ui-color-text-primary);background:var(--ui-color-surface);border:1px solid var(--ui-color-border-secondary);border-radius:var(--ui-radius-l);max-width:440px;padding:24px}dialog::backdrop{background:var(--ui-color-backdrop)}dialog label{display:flex;justify-content:space-between;gap:24px}input[type=checkbox]{accent-color:var(--ui-color-text-primary)}[hidden]{display:none!important}@media(max-width:700px){main{padding:0 12px}header,.notes{flex-direction:column}.stage{padding:25px 8px 45px;min-height:650px}.stage .composer{width:100%}}
</style></head><body><main>
<header><div><h1 data-i18n="laz84.inlineTitle"></h1><p data-i18n="laz84.inlineIntro"></p></div><div class="controls"><a href="/static/prototypes/custom-resolution-prototype.html" data-i18n="laz84.originalDemo"></a><button id="language" data-i18n="laz84.language"></button><button id="theme" data-i18n="laz84.theme"></button></div></header>
<section class="stage"><span class="stage-label" data-i18n="laz84.context"></span>
<div id="composerFocusBackdrop" class="composer-focus-backdrop" aria-hidden="true"></div>
<div id="composer" class="composer open" data-component-name="smart-composer" data-business-component="composer" data-generation-kind="image"><div class="composer-card">
<div id="inputThumbsRow" class="input-thumbs-row"></div>
<ic-icon-button id="composerFocusToggle" class="composer-focus-toggle" size="s" hierarchy="quiet" icon="focus-editor" data-i18n-label="smart.focusEdit" aria-expanded="false"></ic-icon-button>
<div class="prompt-row prompt-editor-shell"><ic-prompt-composer id="promptInput" class="composer-prompt-input" contenteditable="true" data-i18n-aria-label="smart.promptEditor" aria-describedby="promptCharacterCount"></ic-prompt-composer><span id="promptCharacterCount" class="prompt-character-count" data-prompt-character-count></span></div>
<div class="param-row"><div id="dynamicParams" class="dynamic-params">
<ic-select id="model" class="catalog-model-select" name="image-model" data-i18n-aria-label="laz84.model" hierarchy="quiet" placement="top" value="gpt2" data-component-variant="model-picker" data-legal-combination="model-picker-vertical-manual-label"><option value="gpt2">GPT Image 2</option><option value="sunburst">GPT Image 2.5 Sunburst</option><option value="flare">GPT Image 2.5 Flare</option><option value="banana">Nano Banana 2.1</option><ic-icon name="image-generate" size="small" slot="start" aria-hidden="true"></ic-icon><ic-icon name="expand" size="small" slot="expand-icon" aria-hidden="true"></ic-icon></ic-select>
<ic-generation-settings-picker id="sizes" class="generation-settings-picker" data-i18n-label="laz84.openSettings" ratio="16:9" ratio-presets="1:1,4:3,3:4,16:9,9:16" resolution="2K" resolutions="1K,2K,4K" quality="auto" data-smart-generation-settings></ic-generation-settings-picker>
<ic-select id="count" class="generation-count-select" name="generation-count" data-i18n-aria-label="laz84.count" hierarchy="quiet" size="small" placement="top" value="1" data-component-variant="generation-count"><option value="1" data-i18n="laz84.one"></option><option value="2" data-i18n="laz84.two"></option><ic-icon name="expand" size="small" slot="expand-icon" aria-hidden="true"></ic-icon></ic-select>
</div></div>
<div class="composer-actions"><ic-icon-button id="runBtn" class="run-btn" effect="metal" size="large" hierarchy="primary" icon="submit" data-i18n-label="laz84.generate" tooltip-placement="block-start" data-action-combination="primary-icon-action"></ic-icon-button></div>
</div></div></section>
<div class="notes"><div><p data-i18n="laz84.inlineHint"></p><div id="status" role="status"></div><p id="submitted" role="status"></p></div><div><button id="details" data-i18n="laz84.details"></button></div></div>
<section class="walk"><h2 data-i18n="laz84.scenarios"></h2><div class="controls"><button data-scenario="happy" data-i18n="laz84.happy"></button><button data-scenario="error" data-i18n="laz84.error"></button><button data-scenario="fallback" data-i18n="laz84.fallback"></button></div><p id="walkHelp"></p><button id="next" data-i18n="laz84.next"></button> <span id="step"></span></section>
<dialog id="dialog"><h2 data-i18n="laz84.dialog"></h2><p id="dialogModel"></p><h3 data-i18n="laz84.other"></h3><label><span data-i18n="laz84.custom"></span><input id="capability" type="checkbox"></label><p id="capHint"></p><button id="close" data-i18n="laz84.close"></button></dialog>
</main><script type="module" src="/static/prototypes/custom-resolution-inline-prototype.js"></script></body></html>
