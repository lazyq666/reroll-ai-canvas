[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reroll-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "httpx>=0.27,<1"]

[project.scripts]
reroll-mcp = "reroll_mcp:main"

[tool.setuptools]
py-modules = ["reroll_mcp", "bridge", "credentials"]
