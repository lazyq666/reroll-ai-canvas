<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Core creation i18n browser harness</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; grid-template-rows: auto 1fr; font: 14px/1.4 system-ui, sans-serif; }
    header { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border-bottom: 1px solid #d4d4d4; background: #fff; }
    button { min-height: 32px; padding: 4px 10px; }
    button[aria-pressed="true"] { color: #fff; background: #222; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <header aria-label="Audit controls">
    <button type="button" data-page="zimage" aria-pressed="true">Z-Image</button>
    <button type="button" data-page="enhance" aria-pressed="false">Enhance</button>
    <button type="button" data-page="angle" aria-pressed="false">Angle</button>
    <button type="button" data-page="klein" aria-pressed="false">Klein</button>
    <button type="button" data-page="online" aria-pressed="false">Batch</button>
    <button type="button" data-page="canvas" data-src="/static/canvas.html?id=i18n-browser-review" aria-pressed="false">Canvas</button>
    <button type="button" data-page="smart-canvas" data-src="/static/smart-canvas.html?componentReview=nodes" aria-pressed="false">Smart Canvas</button>
    <button type="button" data-page="api-settings" aria-pressed="false">API Settings</button>
    <button type="button" data-page="account-management" aria-pressed="false">Accounts</button>
    <button type="button" data-page="available-model-management" aria-pressed="false">Models</button>
    <button type="button" data-lang="zh-CN" aria-pressed="true">中文</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
  </header>
  <iframe id="preview" title="Core creation page preview" src="/static/zimage.html"></iframe>
  <script>
    const preview = document.querySelector('#preview');
    let language = 'zh-CN';

    function sendLanguage() {
      preview.contentWindow?.postMessage({ type: 'studio-lang', lang: language }, location.origin);
    }

    preview.addEventListener('load', sendLanguage);
    document.querySelectorAll('[data-page]').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('[data-page]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        preview.src = button.dataset.src || `/static/${button.dataset.page}.html`;
      });
    });
    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => {
        language = button.dataset.lang;
        document.documentElement.lang = language;
        document.querySelectorAll('[data-lang]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        sendLanguage();
      });
    });
  </script>
</body>
</html>
