<!doctype html><html lang="zh-CN" data-ui-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="showcase.page"></title>
<link rel="stylesheet" href="/static/css/design-tokens.css"><link rel="stylesheet" href="/static/css/smart-canvas.css"><link rel="stylesheet" href="showcase.css">
<script src="/static/js/i18n-core.js"></script><script src="/static/js/i18n/common.js"></script><script src="/static/js/i18n/smart-canvas.js"></script><script src="/static/js/i18n/showcase.js"></script>
<script type="module" src="/static/js/infinite-canvas-ui/core.js?v=ic-ui-1d9b8d84e857"></script></head><body>
<div class="editor-controls"><ic-button id="play" size="s" hierarchy="secondary" data-i18n="showcase.play"></ic-button><ic-button id="language" size="s" hierarchy="quiet" data-i18n="showcase.language"></ic-button><select id="chapter" data-i18n-aria-label="showcase.preview"><option value="0" data-i18n="showcase.collab"></option><option value="12" data-i18n="showcase.access"></option><option value="24" data-i18n="showcase.tools"></option><option value="48" data-i18n="showcase.library"></option></select><label><span data-i18n="showcase.timeline"></span><input id="frame" type="number" min="0" max="599" value="0" data-i18n-aria-label="showcase.timeline"></label><output id="time">00:00</output><span id="ready" data-i18n="showcase.concept"></span></div>
<main id="film"><div class="film-top"><div><img src="/static/images/brand/logo.svg" alt=""><strong data-i18n="showcase.brand"></strong><span id="scene-name"></span></div><ic-badge tone="neutral" data-i18n="showcase.concept">概念演示</ic-badge></div>
<div id="shell" class="shell"><ic-canvas-grid></ic-canvas-grid>
<ic-button class="smart-back" size="m" hierarchy="secondary"><ic-icon slot="start" name="chevron-left"></ic-icon><span data-i18n="showcase.project"></span></ic-button>
<div class="presence-members"><ic-badge tone="neutral" data-i18n="showcase.online">3 人在线</ic-badge></div>
<ic-smart-canvas-dock id="dock" data-preview-state="static" orientation="vertical" data-position="left" data-i18n-label="showcase.tools">
<ic-icon-button icon="cursor" size="s" hierarchy="quiet" toggle pressed data-i18n-label="showcase.you"></ic-icon-button><ic-icon-button icon="hand" size="s" hierarchy="quiet" data-i18n-label="showcase.project"></ic-icon-button><ic-icon-button icon="brush" size="s" hierarchy="quiet" data-i18n-label="showcase.detail"></ic-icon-button><ic-icon-button icon="text" size="s" hierarchy="quiet" data-i18n-label="showcase.prompt"></ic-icon-button><ic-divider orientation="horizontal"></ic-divider><ic-icon-button icon="prompt-library" size="s" hierarchy="quiet" data-i18n-label="showcase.templates"></ic-icon-button><ic-icon-button icon="image" size="s" hierarchy="quiet" data-i18n-label="showcase.assets"></ic-icon-button>
</ic-smart-canvas-dock>
<div id="nodes"></div><svg id="connections" viewBox="0 0 1280 584" aria-hidden="true"><path></path></svg>
<ic-smart-node-toolbar id="node-toolbar" data-preview-state="visible" data-i18n-label="showcase.tools"></ic-smart-node-toolbar>
<div id="pointers" class="presence-pointer-overlay"></div>
<div id="access-scene" hidden></div>
<ic-card id="tool-panel" hidden><div class="tool-heading"><strong id="tool-title"></strong><ic-icon name="close" size="small"></ic-icon></div><ic-divider></ic-divider><div class="tool-body"><div class="art-column"><canvas id="tool-art" width="1000" height="760"></canvas></div><section id="tool-controls"></section></div><ic-divider></ic-divider><div class="tool-footer"><ic-button size="s" hierarchy="secondary" data-i18n="common.cancel"></ic-button><ic-button size="s" hierarchy="primary" data-i18n="showcase.reuse"></ic-button></div></ic-card>
<ic-card id="library-panel" hidden><ic-prompt-template-library id="templates" data-i18n-aria-label="showcase.templates" aria-label="提示词模板库" active-library="common" active-category="all" open></ic-prompt-template-library><ic-workspace-asset-library id="assets" hidden></ic-workspace-asset-library></ic-card>
<div class="zoom"><ic-button size="s" hierarchy="quiet">−</ic-button><span>100%</span><ic-button size="s" hierarchy="quiet">+</ic-button></div>
</div><footer><div><strong id="headline"></strong><span id="subline"></span></div><span id="counter"></span></footer></main>
<script type="module" src="showcase.js"></script></body></html>
